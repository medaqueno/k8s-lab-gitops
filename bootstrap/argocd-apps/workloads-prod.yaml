apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/medaqueno/k8s-lab-gitops.git
    targetRevision: main
    path: apps/demo-app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod-demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
